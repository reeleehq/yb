[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yb"
version = "0.1.14"
description = "Streamlining media publishing: prepare, upload, and edit videos (YouTube) and podcasts"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["youtube", "podcast", "publishing", "subtitles", "chapters", "yt-dlp"]
authors = [{ name = "Thor Whalen" }]
# Core: the media engine (transcription, chapters, thumbnails, dubbing).
# Everything platform- or transport-specific is an optional extra below.
dependencies = ["mixing"]

[project.license]
text = "mit"

[project.urls]
Homepage = "https://github.com/thorwhalen/yb"
Repository = "https://github.com/thorwhalen/yb"
Documentation = "https://thorwhalen.github.io/yb"

[project.scripts]
yb = "yb.__main__:main"

[project.optional-dependencies]
# `yb.youtube` — upload/edit via the official YouTube Data API v3.
youtube = ["google-api-python-client", "google-auth-oauthlib", "google-auth"]
# `yb.music` / `yb.podcast.cover` — audio→video rendering (needs ffmpeg on PATH).
music = ["muvid>=0.0.7"]
# `yb.download` — fetch videos/metadata from YouTube (and other sites).
# `[default]` brings the JS challenge-solver scripts YouTube now requires; a JS
# runtime (Deno) must also be installed: see README / `yb check`.
download = ["yt-dlp[default]"]
# `yb.podcast` — ID3 chapter frames + RSS episode feeds.
podcast = ["mutagen", "feedgen"]
# LLM-backed metadata/chapter copywriting (title/description/keywords).
llm = ["aix"]
all = [
    "google-api-python-client", "google-auth-oauthlib", "google-auth",
    "muvid>=0.0.7", "yt-dlp[default]", "mutagen", "feedgen", "aix",
]
dev = ["muvid>=0.0.7", "pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0"]
docs = ["sphinx>=6.0", "sphinx-rtd-theme>=1.0"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = ["D100"]
ignore = ["D203", "E501", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]
"**/examples/*" = ["D"]
"**/scrap/*" = ["D"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

# No ffmpeg system dep here: the audio→video rendering (which needs ffmpeg) moved
# to muvid, and muvid declares it. yb's own CI tests need no ffmpeg — the music
# tests skip cleanly when the `music` extra (muvid) isn't installed.

[tool.wads.ci]
project_name = ""

# CI installs `.[youtube]`, not just the core deps: tests/test_youtube_auth.py
# pins the contract with google-auth-oauthlib (the API break behind #7), and
# without the extra it would `importorskip` itself into a silent green.
[tool.wads.ci.install]
extras = "youtube"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = ["3.10", "3.12"]
pytest_args = ["-v", "--tb=short"]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = ["term", "xml"]
exclude_paths = ["examples", "scrap"]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = ["tests/", "scrap/", "examples/"]
